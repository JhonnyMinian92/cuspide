<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huaquillas F.C. — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/client/css/styles.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a2235 0%, #243050 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      border: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-logo {
      width: 72px;
      height: 72px;
      background: #1a2235;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .login-logo span {
      font-size: 1.4rem;
      font-weight: 800;
      color: #e8b84b;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container px-3">
    <div class="card login-card mx-auto">
      <div class="card-body p-5">

        <!-- Logo -->
        <div class="text-center mb-4">
          <div class="login-logo">
            <span>HFC</span>
          </div>
          <h4 class="fw-bold text-dark mb-1">Huaquillas F.C.</h4>
          <p class="text-muted small">Panel de Administración</p>
        </div>

        <!-- Formulario de login -->
        <form>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo electrónico o usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control" id="email" placeholder="admin@huaquillasfc.com">
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••">
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" onclick="togglePasswordVisibility()">
                <i class="bi bi-eye" id="pwdIcon"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a href="#" class="text-decoration-none small" style="color: var(--brand-color);">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="button" class="btn btn-brand w-100 py-2 fw-semibold"
                  onclick="window.location='pages/dashboard.html'">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePasswordVisibility() {
      var pwd = document.getElementById('password');
      var icon = document.getElementById('pwdIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
